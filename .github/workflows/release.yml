# A release from a version tag: tests, the installers with that version, their checksums, and a DRAFT release.
# Write what is new in the draft on GitHub and publish it (tick "pre-release" for a test build: friends never get it).
# Every release has its own number; a test build v0.3.0 that turns out fine is followed by v0.3.1.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # The tag reaches the scripts as an environment variable, never pasted into their text.
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # Runs Gradle; the build itself fetches JetBrains Runtime 21 through its toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the tag
        shell: pwsh
        run: |
          $tag = $env:REF_NAME
          if ($tag -notmatch '^v(\d{1,3})\.(\d{1,3})\.(\d{1,5})$') { throw "Tag '$tag' is not v<MAJOR>.<MINOR>.<BUILD> (digits only)." }
          if ([int]$Matches[1] -gt 255 -or [int]$Matches[2] -gt 255 -or [int]$Matches[3] -gt 65535) {
            throw "Tag '$tag' is beyond Windows Installer's limits (255.255.65535)."
          }
          "VERSION=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test and build the installers
        shell: pwsh
        run: .\gradlew.bat jvmTest packageRequestifyMsi packageRequestifyExe "-Prequestify.version=$env:VERSION"

      - name: Name the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/installer/exe/Requestify-$env:VERSION.exe" "dist/Requestify-Setup-$env:VERSION.exe"
          Copy-Item "build/installer/msi/Requestify-$env:VERSION.msi" "dist/Requestify-$env:VERSION.msi"

      # Signing slot (plan 5 Decision 6): sign dist/*.exe and dist/*.msi here once Requestify is signed
      # (SignPath Foundation or Certum Open Source). Signing must come before the checksums.
      # - name: Sign
      #   run: ...

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", (($lines -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The notes are the same text as PLACEHOLDER_NOTES in UpdatedCard.kt: left unchanged, the "Bijgewerkt" card leaves them out.
          gh release create "$env:REF_NAME" (Get-ChildItem dist -File).FullName --draft `
            --title "Requestify $env:VERSION" `
            --notes "Schrijf hier wat er nieuw is. / Write what's new here."
