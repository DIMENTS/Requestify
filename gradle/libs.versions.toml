[versions]
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
# 1.9.0 has the Expressive API internal (no MaterialExpressiveTheme/LinearWavyProgressIndicator/ButtonGroup public),
# so use the first pre-release that exposes them (>= 1.12.0-alpha03 per plan).
compose-material3 = "1.12.0-alpha03"
materialkolor = "5.0.1"
ktor = "3.6.1"
coroutines = "1.11.0"
serialization-json = "1.13.0"
coil = "3.6.3"
reorderable = "3.1.0"
jna = "5.19.1"
# The no-op SLF4J provider, matching the slf4j-api that Ktor brings: silences "No SLF4J providers were found".
slf4j = "2.0.19"
# The JetBrains Runtime's API (custom title bar); its calls only work when running on JBR.
jbr-api = "1.12.0"

[libraries]
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
jbr-api = { module = "org.jetbrains.runtime:jbr-api", version.ref = "jbr-api" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
